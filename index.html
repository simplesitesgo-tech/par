<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Par: the score you need on every assignment</title>
<meta name="description" content="Par pulls your real Canvas grades and shows the exact score you need on every remaining assignment to hit your target grade. Everything stays in your browser.">
<meta name="theme-color" content="#0A0F1A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0F1A'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23243044' stroke-width='6'/%3E%3Cpath d='M32 14a18 18 0 0 1 17 24' fill='none' stroke='%23C6FF3D' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div></div>

  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/" aria-label="Par home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="4"/><path d="M16 5a11 11 0 0 1 10.4 14.6" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/></svg>
        <span>Par</span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Main">
        <a href="#/" data-tab="home">Dashboard</a>
        <a href="#/next" data-tab="next">Up next</a>
        <a href="#/setup" data-tab="setup">Setup</a>
      </nav>
      <div class="top-right" id="topRight"></div>
    </div>
  </header>

  <div id="banner"></div>
  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="foot wrap">
    <div class="privacy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><strong>Your grades never leave this browser.</strong> No server, no account, no tracking. Par saves everything on this device only.</span>
    </div>
    <div class="foot-meta">Par. Every assignment has a par score. Hit it and you hit your grade.</div>
  </footer>

  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="bookmarklet.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
